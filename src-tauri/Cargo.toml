[package]
name = "alchemide"
version = "0.0.0"
description = "A lightweight, mood-themed code editor"
authors = ["Nathã Grazzioli Botelho"]
license = "GPL-3.0-only"
repository = "https://github.com/localhost-ayu/alchemide"
edition = "2021"

[lib]
name = "alchemide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
ignore = "0.4.35"
notify = "9.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
